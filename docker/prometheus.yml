global:
  scrape_interval: 15s

scrape_configs:
  - job_name: notifyx
    static_configs:
      # "api" is the docker-compose service name (see ../docker-compose.yml).
      # If running the Go server outside compose instead (`go run ./cmd/server`),
      # change this to "host.docker.internal:8080".
      - targets: ["api:8080"]
